name: Docs

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Generate docs
        run: doxygen Doxyfile

      - name: Assemble site
        # The landing page at the root, the Doxygen docs under /api/.
        run: |
          mkdir -p site/api
          cp -R docs/. site/
          cp -R doxygen/html/. site/api/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
